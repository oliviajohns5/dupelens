[package]
name = "dupelens-desktop"
version = "0.1.0"
description = "DupeLens desktop app"
edition = "2021"

[lib]
name = "dupelens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
